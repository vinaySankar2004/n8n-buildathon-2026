# Slack app for newsReels. The bot is called NewsReels in Slack. In Slack: api.slack.com/apps, Create New App, From a manifest,
# pick the n8n-buildathon workspace, paste this file, Create, then Install to Workspace.
# The bot token it produces goes in .env as SLACK_BOT_TOKEN, never in git. On the host laptop, the
# Signing Secret from the app's Basic Information page goes in .env as SLACK_SIGNING_SECRET.
# After changing this file: paste it into the app's App Manifest page, save, then reinstall the app.
display_information:
  name: NewsReels
  description: "newsReels: drafts short news videos from your sources for your editor to review in a thread, and answers @NewsReels requests."
  background_color: "#173332"
features:
  bot_user:
    display_name: NewsReels
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - files:write
      - channels:read
      - channels:join
      # Thread replies from the editor reach 7 Chat as message events.
      - channels:history
      - groups:history
      # The name of whoever asks the bot for something, for the run ledger.
      - users:read
settings:
  event_subscriptions:
    # The editor's replies in a review thread. The router checks Slack's signature, then hands them to 7 Chat.
    request_url: https://paratactical-professionally-yasuko.ngrok-free.dev/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    # The review buttons (Approve script, Approve and publish, Reject). The router checks Slack's
    # signature and hands them to 7 Chat.
    is_enabled: true
    request_url: https://paratactical-professionally-yasuko.ngrok-free.dev/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
