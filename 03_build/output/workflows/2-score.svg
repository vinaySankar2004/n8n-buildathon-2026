<svg xmlns="http://www.w3.org/2000/svg" width="676" height="772" viewBox="0 0 676 772" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="676" height="772" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">2 Score</text>
<text x="40" y="752" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="460" height="192" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">2 Score</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Gets every source Collect returned. Compares each category's</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">count this week with its average over the 8 weeks before, keeps</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">changes of at least 20 and twice (or half) the usual level, and</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12">returns the strongest as story.</text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">Nothing passing the bar gives ok: false, which becomes the &quot;no</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12">story today&quot; note.</text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12">Its test webhook takes an array of Collect outputs.</text>
