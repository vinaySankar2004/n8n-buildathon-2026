<svg xmlns="http://www.w3.org/2000/svg" width="2296" height="932" viewBox="0 0 2296 932" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="2296" height="932" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">2b Context</text>
<text x="40" y="912" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="460" height="336" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">2b Context</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Fetches every news feed in the client's config (RSS, Environment</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">Canada weather alerts, DriveBC road events) and adds the newest</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">12 items since the story's week began to the run as reports.</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12">Write decides which, if any, fit the story.</text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">For a story someone asked for in Slack, Search the web has Claude</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12">search for recent reporting on it (Anthropic web search). Web</text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12">sources keeps each page it cited, with the exact words cited, as</text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12">reports w1, w2... They go to Write, the editor's review card and</text>
<text x="54" y="266" font-size="12" font-weight="400" fill="#4a3f12">the trace.</text>
<text x="54" y="282" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="298" font-size="12" font-weight="400" fill="#4a3f12">For every story, 2c Reddit adds how people are reacting on Reddit</text>
<text x="54" y="314" font-size="12" font-weight="400" fill="#4a3f12">(opinion only, never data).</text>
<text x="54" y="330" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="346" font-size="12" font-weight="400" fill="#4a3f12">A feed, search or Reddit read that fails is listed in</text>
<text x="54" y="362" font-size="12" font-weight="400" fill="#4a3f12">feeds_checked and skipped: news never stops a run.</text>
<text x="54" y="378" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="394" font-size="12" font-weight="400" fill="#4a3f12">An empty test body uses Sample run.</text>
