<svg xmlns="http://www.w3.org/2000/svg" width="1416" height="792" viewBox="0 0 1416 792" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1416" height="792" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">2b Context</text>
<text x="40" y="772" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="460" height="192" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">2b Context</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Fetches every news feed in the client's config (RSS, Environment</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">Canada weather alerts, DriveBC road events) and adds the newest</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">12 items since the story's week began to the run as reports.</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12">Write decides which, if any, fit the story.</text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">A feed that fails is listed in feeds_checked and skipped: news</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12">never stops a run.</text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12">An empty test body uses Sample run.</text>
