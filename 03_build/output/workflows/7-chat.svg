<rect x="0" y="0" width="4496" height="1852" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">7 Chat</text>
<text x="40" y="1832" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="520" height="256" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">7 Chat</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">The editor's review, as a conversation in one Slack thread per story.</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">Start review posts the headline, script, the data behind it and what goes</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12">on screen, with Approve script and Reject. Replies in the thread go to</text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12">Claude (Revise with Claude), and every change passes the same number guard</text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">as Write. Approve script makes the voice and video and posts them in the</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12">thread; replies can still change it, which remakes the video. Approve and</text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12">publish runs 6 Publish.</text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="266" font-size="12" font-weight="400" fill="#4a3f12">Each thread's draft and history are saved in the data table</text>
<text x="54" y="282" font-size="12" font-weight="400" fill="#4a3f12">editor_threads. Slack reaches Slack event through the router, which checks</text>
<text x="54" y="298" font-size="12" font-weight="400" fill="#4a3f12">Slack's signature. A new message that mentions the bot goes to 8 Request.</text>
<text x="54" y="314" font-size="12" font-weight="400" fill="#4a3f12">Update ledger records every step in the run ledger.</text>
