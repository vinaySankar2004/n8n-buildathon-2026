<svg xmlns="http://www.w3.org/2000/svg" width="4936" height="1052" viewBox="0 0 4936 1052" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="4936" height="1052" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">8 Request</text>
<text x="40" y="1032" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="560" height="240" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">8 Request</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Anyone in the editor channel can write &quot;@Newsroom make a video about graffiti in</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">Mount Pleasant&quot; or ask &quot;@Newsroom how many noise complaints this week?&quot;. 7 Chat</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">hands the message here.</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12">Collect gets every data source; Read request (Claude Haiku) matches the ask to a</text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">real category and neighbourhood; Plan checks the match. A neighbourhood gets its</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12">own 9 weeks of data. Requested story builds the story and a one-line answer from</text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12">the numbers.</text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="266" font-size="12" font-weight="400" fill="#4a3f12">A question gets the answer in the thread. A video request runs Context and</text>
<text x="54" y="282" font-size="12" font-weight="400" fill="#4a3f12">Write, then Start review opens the usual review in the same thread through 7</text>
<text x="54" y="298" font-size="12" font-weight="400" fill="#4a3f12">Chat's webhook. Every outcome goes to the run ledger.</text>
