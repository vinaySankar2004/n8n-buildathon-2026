<svg xmlns="http://www.w3.org/2000/svg" width="2956" height="1072" viewBox="0 0 2956 1072" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="2956" height="1072" fill="#f6f7f9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">0 Orchestrator</text>
<text x="40" y="1052" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="540" height="240" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">0 Orchestrator</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Runs NewsReels for one client, Rain City Ledger. Client holds its config;</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">Data sources lists its datasets. 1 Collect runs once per dataset, 2 Score</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">picks the week's strongest change, 2b Context adds recent reports from the</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12">client's news feeds, 3 Write drafts it, Save trace writes the run trace</text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12">pages, and 7 Chat posts the draft, its data and the trace link to the editor</text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">in Slack. From there the editor's thread drives Voice, Render and Publish.</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12">If any step says ok: false, or errors, No story today tells the editor why in</text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12">Slack.</text>
<text x="54" y="266" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="282" font-size="12" font-weight="400" fill="#4a3f12">Every morning stays off while building. To test the guard, set test_tamper to</text>
<text x="54" y="298" font-size="12" font-weight="400" fill="#4a3f12">true in Run options.</text>
