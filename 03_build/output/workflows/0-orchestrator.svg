<text x="40" y="44" font-size="20" font-weight="700" fill="#1c2430">0 Orchestrator</text>
<text x="40" y="1052" font-size="12" fill="#667085">Grey line: the run goes on. Red dashed line: the error or "no" path. Drawn from 03_build/output/workflows/, the JSON deployed to n8n.</text>
<rect x="40" y="74" width="460" height="208" rx="8" fill="#fff6d6" stroke="#e8d27a"/>
<text x="54" y="100" font-size="16" font-weight="700" fill="#4a3f12">0 Orchestrator</text>
<text x="54" y="122" font-size="12" font-weight="400" fill="#4a3f12">Vancouver sources lists the datasets to watch. 1 Collect runs</text>
<text x="54" y="138" font-size="12" font-weight="400" fill="#4a3f12">once per source, 2 Score picks the week's strongest change, then</text>
<text x="54" y="154" font-size="12" font-weight="400" fill="#4a3f12">Write, Voice, Render and Publish.</text>
<text x="54" y="170" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="186" font-size="12" font-weight="400" fill="#4a3f12">If any step says ok: false, or errors, No story today tells the</text>
<text x="54" y="202" font-size="12" font-weight="400" fill="#4a3f12">editor why in Slack.</text>
<text x="54" y="218" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="234" font-size="12" font-weight="400" fill="#4a3f12">Every morning stays off while building.</text>
<text x="54" y="250" font-size="12" font-weight="400" fill="#4a3f12"></text>
<text x="54" y="266" font-size="12" font-weight="400" fill="#4a3f12">To test the guard, set test_tamper to true in Run options.</text>
